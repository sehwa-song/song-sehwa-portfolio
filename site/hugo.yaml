      enable: true
      title: "기술 역량과 프로젝트 적용 사례입니다:"
      items:
        - "**React·Vite:** A2A Agent Company 프론트엔드 구현"
        - "**FastAPI·SQLite:** 회원 정보 관리 API 및 데이터베이스 구현"
        - "**JWT:** 로그인 및 보호 API 인증 구현"
