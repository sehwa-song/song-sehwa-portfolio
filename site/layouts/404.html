{{ define "head" }}
<meta name="description" content="요청하신 페이지가 존재하지 않거나 주소가 변경되었습니다.">
{{ end }}

{{ define "title" }}
페이지를 찾을 수 없습니다 | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<div class="container py-5 text-center">
    <img src="{{ (printf "%s404.png" (.Site.Params.staticPath | default "")) | strings.TrimPrefix "/" | relURL }}" alt="404 오류" class="img-fluid" width="40%">
    <h1 class="mt-4">페이지를 찾을 수 없습니다</h1>
    <p class="my-3">요청하신 페이지가 존재하지 않거나 주소가 변경되었습니다.</p>
    <a href="{{ "" | relURL }}" class="btn btn-primary">홈으로 돌아가기</a>
</div>
{{ end }}
